<title>El Mazo · Dark Side</title>
<style>
  *,*::before,*::after{ box-sizing:border-box; }
  :root{
    --field:#0A0F20; --ink:#1b2036; --ink-dim:#5b617a; --page:#e9ebf1; --page2:#dfe2ea; --bone:#ECE3C8; --bone-dim:#8E886B;
    --amber:#F3A24B; --ember:#FF7A2E; --yellow:#FFD23F; --green:#3FB85A; --cyan:#25C3E8; --red:#E2413B; --violet:#8B39D6;
    --rx:0deg; --ry:0deg; --px:50; --py:32; --active:.16;
  }
  html,body{ height:100%; }
  body{ margin:0; min-height:100dvh;
    background:radial-gradient(140% 100% at 50% 0%, #f3f4f8 0%, var(--page) 55%, var(--page2) 100%);
    color:var(--ink); font-family:"Cormorant Garamond",Georgia,serif;
    display:flex; flex-direction:column; align-items:center;
    gap:clamp(12px,2vh,22px); padding:clamp(20px,4vh,44px) 14px clamp(30px,6vh,64px); overflow-x:hidden; -webkit-font-smoothing:antialiased; }

  .brand{ text-align:center; padding:0 16px; }
  .brand .eye{ margin:0; font-size:.68rem; letter-spacing:.5em; text-indent:.5em; text-transform:uppercase; color:var(--ink-dim); }
  .brand h1{ margin:.3em 0 0; font-weight:700; font-size:clamp(1.5rem,4.4vw,2.4rem); letter-spacing:.02em; color:var(--ink); }
  .brand .sub{ margin:.15em 0 0; font-style:italic; font-size:.95rem; color:var(--ink-dim); }

  .gallery{ display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(22px,2.8vw,44px);
    width:100%; max-width:1360px; padding:clamp(24px,4vh,52px) clamp(12px,2vw,30px); }
  .card{ position:relative; cursor:pointer; transition:transform .32s cubic-bezier(.3,1.1,.5,1); }
  .card:hover{ transform:translateY(-12px); }
  .card:focus-visible{ outline:none; }

  .tiltcard{ position:relative; width:100%; aspect-ratio:5/7; container-type:inline-size;
    transform-style:preserve-3d; border-radius:14px;
    box-shadow:0 16px 34px -14px rgba(20,26,54,.5),0 3px 10px -4px rgba(20,26,54,.3); transition:box-shadow .32s; }
  .card:hover .tiltcard{ box-shadow:0 36px 62px -16px rgba(20,26,54,.55),0 8px 20px -6px rgba(20,26,54,.35); }
  .card:focus-visible .tiltcard{ box-shadow:0 0 0 3px var(--amber),0 16px 34px -14px rgba(20,26,54,.5); }
  .card__inner{ position:absolute; inset:0; border-radius:14px; overflow:hidden; background:#05060f; isolation:isolate; }
  .scene{ position:absolute; inset:0; width:100%; height:100%; }

  .foil{ position:absolute; inset:0;
    background:repeating-linear-gradient(112deg,hsla(0,90%,62%,.5) 0%,hsla(45,100%,60%,.5) 8%,hsla(140,80%,55%,.5) 16%,hsla(190,100%,60%,.5) 24%,hsla(275,100%,68%,.5) 32%,hsla(325,100%,64%,.5) 40%,hsla(0,90%,62%,.5) 48%);
    background-size:280% 280%; background-position:calc(var(--px)*1%) calc(var(--py)*1%);
    mix-blend-mode:overlay; opacity:.05; pointer-events:none; }
  .lb-card .foil{ opacity:calc(.05+var(--active)*.16); }
  .glare{ position:absolute; inset:0;
    background:radial-gradient(26% 20% at calc(var(--px)*1%) calc(var(--py)*1%),rgba(255,255,255,.3),rgba(255,255,255,.05) 44%,transparent 66%);
    mix-blend-mode:soft-light; opacity:0; pointer-events:none; }
  .lb-card .glare{ opacity:calc(.18+var(--active)*.42); }
  .grain{ position:absolute; inset:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='150' height='150' filter='url(%23n)' opacity='0.5'/></svg>");
    mix-blend-mode:overlay; opacity:.16; pointer-events:none; }
  .vignette{ position:absolute; inset:0; border-radius:14px; box-shadow:0 0 60px 14px rgba(0,0,0,.5) inset; pointer-events:none; }
  .frame{ position:absolute; inset:6px; border-radius:9px; border:1px solid rgba(236,227,200,.22); pointer-events:none; }

  .idx{ position:absolute; top:5cqi; left:0; right:0; display:flex; justify-content:center; z-index:3; }
  .idx span{ display:grid; place-items:center; min-width:8.6cqi; height:8.6cqi; padding:0 1.4cqi; border-radius:999px;
    border:1px solid rgba(236,227,200,.4); font-size:3.4cqi; font-weight:600; letter-spacing:.05em; color:var(--bone); background:rgba(6,9,18,.4); }
  .plate{ position:absolute; left:0; right:0; bottom:0; text-align:center; z-index:3; padding:16cqi 4cqi 5.5cqi;
    background:linear-gradient(to top,rgba(4,5,13,.95) 6%,rgba(4,5,13,.5) 52%,transparent 100%); }
  .name{ margin:0 auto; font-weight:600; line-height:1.02; letter-spacing:.09em; text-transform:uppercase; color:var(--bone); text-wrap:balance; }
  .series{ margin:2.2cqi 0 0; display:flex; align-items:center; justify-content:center; gap:2cqi;
    font-size:2.2cqi; font-style:italic; letter-spacing:.22em; text-indent:.22em; text-transform:uppercase; color:var(--bone-dim); }
  .series::before,.series::after{ content:""; width:6cqi; height:1px; background:linear-gradient(90deg,transparent,rgba(236,227,200,.4)); }
  .series::after{ transform:scaleX(-1); }

  .hint{ margin:0; text-align:center; font-style:italic; font-size:.95rem; color:var(--ink-dim); }
  .hint b{ color:var(--ember); font-weight:600; font-style:normal; }

  .lightbox{ position:fixed; inset:0; z-index:100; display:grid; place-items:center; }
  .lightbox[hidden]{ display:none; }
  .lb-backdrop{ position:absolute; inset:0; background:rgba(226,229,238,.5); backdrop-filter:blur(18px) saturate(1.1); -webkit-backdrop-filter:blur(18px) saturate(1.1); animation:fade .3s ease; }
  .lb-card{ position:relative; z-index:2; height:min(88vh,760px); aspect-ratio:5/7; animation:pop .4s cubic-bezier(.2,1.1,.4,1); }
  .lb-card .tiltcard{ position:absolute; inset:0; transform:rotateX(var(--rx)) rotateY(var(--ry)); box-shadow:0 40px 90px -20px rgba(10,14,40,.6); }
  .lb-close{ position:absolute; top:16px; right:18px; z-index:6; width:44px; height:44px; border-radius:50%; border:1px solid rgba(20,26,54,.2); background:rgba(255,255,255,.72); color:var(--ink); font-size:1.5rem; cursor:pointer; }
  .lb-nav{ position:absolute; top:50%; transform:translateY(-50%); z-index:6; width:52px; height:52px; border-radius:50%; border:1px solid rgba(20,26,54,.2); background:rgba(255,255,255,.72); color:var(--ink); font-size:1.7rem; cursor:pointer; }
  .lb-nav.prev{ left:max(12px,3vw); } .lb-nav.next{ right:max(12px,3vw); }
  .lb-close:hover,.lb-nav:hover{ background:#fff; }
  .lb-close:focus-visible,.lb-nav:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
  @keyframes fade{ from{opacity:0} to{opacity:1} }
  @keyframes pop{ from{opacity:0;transform:scale(.92)} to{opacity:1;transform:scale(1)} }

  @keyframes twinkle{ 0%,100%{opacity:.1} 50%{opacity:.85} }
  @keyframes tick{ to{ transform:rotate(360deg) } }
  @keyframes spin{ to{ transform:rotate(360deg) } }
  @keyframes spinr{ to{ transform:rotate(-360deg) } }
  @keyframes rippleB{ 0%{opacity:0;transform:scale(.4)} 20%{opacity:.5} 100%{opacity:0;transform:scale(1.3)} }
  @keyframes beat{ 0%,72%,100%{transform:scale(1)} 12%{transform:scale(1.06)} 30%{transform:scale(1.02)} 46%{transform:scale(1.08)} }
  @keyframes glowp{ 0%,100%{opacity:.8} 50%{opacity:1} }
  @keyframes flick{ 0%,100%{transform:scaleY(1);opacity:.85} 50%{transform:scaleY(1.14);opacity:1} }
  @keyframes drift{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-1.4px)} }
  @keyframes rise{ 0%{opacity:0;transform:translateY(5px)} 40%{opacity:.9} 100%{opacity:0;transform:translateY(-10px)} }
  @keyframes vortex{ to{ transform:rotate(360deg) } }
  @keyframes shimx{ 0%,100%{opacity:.55} 50%{opacity:.95} }
  @keyframes fall{ 0%{opacity:0;transform:translateY(-3px)} 15%{opacity:1} 100%{opacity:0;transform:translateY(32px)} }
  @keyframes pigbob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-1.8px)} }

  .pulse{ transform-box:view-box; transform-origin:50px 66px; animation:rippleB 6s ease-out infinite; }
  .pulse.p2{ animation-delay:3s; }
  .beat{ transform-box:view-box; transform-origin:50px 60px; animation:beat 3.4s ease-in-out infinite; }
  .ecg{ animation:glowp 3.4s ease-in-out infinite; }
  .spin{ transform-box:view-box; transform-origin:50px 60px; animation:spin 220s linear infinite; }
  .vtx{ transform-box:view-box; transform-origin:54px 60px; animation:vortex 90s linear infinite; }
  .fire{ transform-box:view-box; transform-origin:center bottom; animation:flick 1.4s ease-in-out infinite; }
  .drift{ transform-box:view-box; transform-origin:50px 60px; animation:drift 6s ease-in-out infinite; }
  .rise circle{ transform-box:view-box; animation:rise 4s ease-in-out infinite; }
  .rise circle:nth-child(2){ animation-delay:1.3s } .rise circle:nth-child(3){ animation-delay:2.6s }
  .second{ transform-box:view-box; transform-origin:50px 62px; animation:tick 60s steps(60,end) infinite; }
  .shimx{ animation:shimx 5s ease-in-out infinite; }
  .diamond{ animation:glowp 3s ease-in-out infinite; }
  .fall circle{ transform-box:view-box; animation:fall 2.6s linear infinite; }
  .fall circle:nth-child(2){ animation-delay:.9s; } .fall circle:nth-child(3){ animation-delay:1.8s; }
  .pigbob{ transform-box:view-box; animation:pigbob 5s ease-in-out infinite; }
  .card .scene *{ animation-play-state:paused; }
  .lb-card .scene *{ animation-play-state:running !important; }

  @media (prefers-reduced-motion:reduce){ *{ animation:none !important; } .card,.tiltcard,.lb-card{ transition:none !important; } }
  @media (max-width:1080px){ .gallery{ grid-template-columns:repeat(3,1fr); max-width:1000px; } }
  @media (max-width:720px){ .gallery{ grid-template-columns:repeat(2,1fr); gap:18px; } }
</style>

      // pair of clock hands per ring, frozen at different times for a restless feel
      const hourA=(theta+ (i*47)%360)*Math.PI/180, minA=(theta+ (i*160)%360)*Math.PI/180;
      g.appendChild(el('line',{x1:VPx,y1:VPy,x2:(VPx+Math.sin(hourA)*R*0.42).toFixed(2),y2:(VPy-Math.cos(hourA)*R*0.42).toFixed(2),stroke:'#171009','stroke-width':(R*0.028).toFixed(2),'stroke-linecap':'round',opacity:(0.9-dark).toFixed(2)}));
      g.appendChild(el('line',{x1:VPx,y1:VPy,x2:(VPx+Math.sin(minA)*R*0.66).toFixed(2),y2:(VPy-Math.cos(minA)*R*0.66).toFixed(2),stroke:'#171009','stroke-width':(R*0.018).toFixed(2),'stroke-linecap':'round',opacity:(0.9-dark).toFixed(2)}));
      // little black weight/bob hanging in the band
      if(i<8){ const ba=(theta+150)*Math.PI/180, bx=VPx+Math.sin(ba)*R*0.70, by=VPy-Math.cos(ba)*R*0.70;
        g.appendChild(el('circle',{cx:bx.toFixed(2),cy:by.toFixed(2),r:(R*0.05).toFixed(2),fill:'url(#g4bob)',opacity:(0.95-dark*0.8).toFixed(2)})); }
    }
    // faint central pupil so the tunnel truly bottoms out
    g.appendChild(el('circle',{cx:VPx,cy:VPy,r:'1.1',fill:'#f3ead2',opacity:'.5'}));
  })();

  // eclipse corona rays (card 10)
  (function(){ const g=cards[9].querySelector('#cor10'); if(!g)return;
    for(let i=0;i<60;i++){ const ang=i*6*Math.PI/180, len=(i%2?9:5)+Math.random()*3; const l=document.createElementNS(NS,'line');
      l.setAttribute('x1',(50+Math.cos(ang)*19).toFixed(1)); l.setAttribute('y1',(64+Math.sin(ang)*19).toFixed(1));
      l.setAttribute('x2',(50+Math.cos(ang)*(19+len)).toFixed(1)); l.setAttribute('y2',(64+Math.sin(ang)*(19+len)).toFixed(1)); g.appendChild(l); } })();

  // Great Gig (card 5): god-ray beams + backlit concert crowd
  (function(){ const g=cards[4].querySelector('#rays5'); if(!g)return; const ax=50, ay=13;
    const rays=[[-44,.85,.5],[-30,.6,.35],[-16,.5,.22],[0,.7,.4],[15,.5,.24],[29,.62,.36],[43,.8,.48]];
    rays.forEach(([dx,w,op])=>{ const bx=ax+dx*3.0; const l=document.createElementNS(NS,'line');
      l.setAttribute('x1',ax); l.setAttribute('y1',ay); l.setAttribute('x2',bx.toFixed(1)); l.setAttribute('y2','150');
      l.setAttribute('stroke-width',w); l.setAttribute('stroke-opacity',op); l.setAttribute('filter','url(#soft)'); g.appendChild(l); }); })();
  (function(){ const g=cards[4].querySelector('#crowd5'); if(!g)return; const dark='#06070d';
    const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
    // rolling rows of heads+shoulders, back (small/high) to front (big/low)
    const rows=[{y:126,r:2.7,n:15,op:.82},{y:132,r:3.5,n:12,op:.92},{y:139,r:4.4,n:10,op:1}];
    rows.forEach((row)=>{ for(let i=0;i<row.n;i++){ const x=(i+0.5+(Math.random()*.5-.25))*(114/row.n)-7; const r=row.r*(0.82+Math.random()*0.5);
      g.appendChild(el('path',{d:`M${(x-r*2.1).toFixed(1)},142 C${(x-r*2).toFixed(1)},${(row.y+r*1.4).toFixed(1)} ${(x-r*1.1).toFixed(1)},${(row.y+r*0.9).toFixed(1)} ${x.toFixed(1)},${(row.y+r*0.85).toFixed(1)} C${(x+r*1.1).toFixed(1)},${(row.y+r*0.9).toFixed(1)} ${(x+r*2).toFixed(1)},${(row.y+r*1.4).toFixed(1)} ${(x+r*2.1).toFixed(1)},142 Z`,fill:dark,opacity:row.op}));
      g.appendChild(el('circle',{cx:x.toFixed(1),cy:row.y.toFixed(1),r:r.toFixed(1),fill:dark,opacity:row.op})); } });
    // raised arms reaching up with splayed hands
    const NAR=24;
    for(let i=0;i<NAR;i++){ const bx=-4+(i+0.5+Math.random()*.5)*(110/NAR), baseY=131+Math.random()*7;
      const ang=(Math.random()*0.6-0.3), len=17+Math.random()*17, wx=bx+Math.sin(ang)*len, wy=baseY-Math.cos(ang)*len;
      g.appendChild(el('line',{x1:bx.toFixed(1),y1:baseY.toFixed(1),x2:wx.toFixed(1),y2:wy.toFixed(1),stroke:dark,'stroke-width':(1.5+Math.random()*0.8).toFixed(2),'stroke-linecap':'round'}));
      g.appendChild(el('circle',{cx:wx.toFixed(1),cy:wy.toFixed(1),r:'1.15',fill:dark}));
      const nf=3+(Math.random()<.6?1:0); for(let f=0;f<nf;f++){ const fa=ang+(f-(nf-1)/2)*0.34, fl=2.3+Math.random()*1.4;
        g.appendChild(el('line',{x1:wx.toFixed(1),y1:wy.toFixed(1),x2:(wx+Math.sin(fa)*fl).toFixed(1),y2:(wy-Math.cos(fa)*fl).toFixed(1),stroke:dark,'stroke-width':'0.72','stroke-linecap':'round'})); } }
  })();

  // Any Colour (card 8): graffiti spray dispersion
  (function(){ const g=cards[7].querySelector('#spray8'); if(!g)return; const px=-0.84, py=0.54;
    for(let i=0;i<95;i++){ const t=Math.random(), ax=50+43*t, ay=66+67*t, spread=2+t*27, off=(Math.random()-.5)*spread*2;
      const x=ax+px*off, y=ay+py*off; if(y>150||x>112||x<20) continue;
      const c=document.createElementNS(NS,'circle'); c.setAttribute('cx',x.toFixed(1)); c.setAttribute('cy',y.toFixed(1));
      c.setAttribute('r',(Math.random()*1.2+.3).toFixed(2)); c.setAttribute('fill',`hsl(${Math.round(15+t*285)},92%,60%)`);
      c.setAttribute('opacity',(Math.random()*.5*(1-t*0.45)+.14).toFixed(2)); g.appendChild(c); } })();

  // Money (card 6): great seal ticks, glory rays, pyramid courses
  (function(){ const g=cards[5].querySelector('#sealticks6'); if(!g)return; const cx=50,cy=66;
    for(let i=0;i<72;i++){ const a=i*5*Math.PI/180; const l=document.createElementNS(NS,'line');
      l.setAttribute('x1',(cx+Math.cos(a)*44).toFixed(1)); l.setAttribute('y1',(cy+Math.sin(a)*44).toFixed(1));
      l.setAttribute('x2',(cx+Math.cos(a)*45.6).toFixed(1)); l.setAttribute('y2',(cy+Math.sin(a)*45.6).toFixed(1));
      l.setAttribute('stroke-width','.4'); g.appendChild(l);} })();
  (function(){ const g=cards[5].querySelector('#glory6'); if(!g)return; const cx=50,cy=39;
    for(let i=0;i<32;i++){ const a=i*(360/32)*Math.PI/180, r1=12+(i%2?0:2.5), r2=r1+(i%2?4.5:8);
      const l=document.createElementNS(NS,'line'); l.setAttribute('x1',(cx+Math.cos(a)*r1).toFixed(1)); l.setAttribute('y1',(cy+Math.sin(a)*r1).toFixed(1));
      l.setAttribute('x2',(cx+Math.cos(a)*r2).toFixed(1)); l.setAttribute('y2',(cy+Math.sin(a)*r2).toFixed(1));
      l.setAttribute('stroke-width','.5'); l.setAttribute('stroke-opacity',(0.14+Math.random()*0.24).toFixed(2)); g.appendChild(l);} })();
  (function(){ const g=cards[5].querySelector('#courses6'); if(!g)return; const apexY=56, baseY=102;
    for(let y=60;y<=98;y+=3.2){ const t=(baseY-y)/(baseY-apexY), xl=30+13*t, xr=70-13*t;
      const l=document.createElementNS(NS,'line'); l.setAttribute('x1',xl.toFixed(1)); l.setAttribute('y1',y.toFixed(1)); l.setAttribute('x2',xr.toFixed(1)); l.setAttribute('y2',y.toFixed(1)); l.setAttribute('stroke-width','.35'); g.appendChild(l);} })();

  /* ---- lightbox ---- */
  const lightbox=document.getElementById('lightbox'), lbInner=document.getElementById('lbInner'), lbCard=lightbox.querySelector('.lb-card .tiltcard');
  let active=0;
  function openLB(i){ active=(i+10)%10; lbInner.innerHTML=cards[active].querySelector('.card__inner').innerHTML; lightbox.hidden=false; document.body.style.overflow='hidden'; }
  function closeLB(){ lightbox.hidden=true; document.body.style.overflow=''; rest(); }
  function lbNav(d){ openLB(active+d); }
  cards.forEach((c,i)=>{ c.tabIndex=0; c.setAttribute('role','button'); c.setAttribute('aria-label',META[i+1].t);
    c.addEventListener('click',()=>openLB(i));
    c.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openLB(i); } }); });
  lightbox.querySelector('.lb-backdrop').addEventListener('click',closeLB);
  lightbox.querySelector('.lb-close').addEventListener('click',closeLB);
  lightbox.querySelector('.lb-nav.prev').addEventListener('click',e=>{ e.stopPropagation(); lbNav(-1); });
  lightbox.querySelector('.lb-nav.next').addEventListener('click',e=>{ e.stopPropagation(); lbNav(1); });
  addEventListener('keydown',e=>{ if(lightbox.hidden) return; if(e.key==='Escape') closeLB(); else if(e.key==='ArrowLeft') lbNav(-1); else if(e.key==='ArrowRight') lbNav(1); });

  /* ---- tilt / foil on the focused (lightbox) card ---- */
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches, rootS=document.documentElement;
  const REST={rx:0,ry:0,px:50,py:32,active:.16}, target={...REST}, cur={...REST}, MAX=9;
  function fromPoint(x,y){ const r=lbCard.getBoundingClientRect();
    const nx=Math.max(-1,Math.min(1,(x-r.left)/r.width*2-1)), ny=Math.max(-1,Math.min(1,(y-r.top)/r.height*2-1));
    target.rx=-ny*MAX; target.ry=nx*MAX; target.px=(nx*.5+.5)*100; target.py=(ny*.5+.5)*100; target.active=1; }
  function rest(){ Object.assign(target,REST); }
  if(!reduce){
    lightbox.addEventListener('pointermove',e=>{ if(lightbox.hidden) return; const r=lbCard.getBoundingClientRect();
      if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom) fromPoint(e.clientX,e.clientY); else rest(); });
    lightbox.addEventListener('pointerleave',rest);
    (function loop(){ const k=.12; for(const key in cur) cur[key]+=(target[key]-cur[key])*k;
      rootS.style.setProperty('--rx',cur.rx.toFixed(2)+'deg'); rootS.style.setProperty('--ry',cur.ry.toFixed(2)+'deg');
      rootS.style.setProperty('--px',cur.px.toFixed(1)); rootS.style.setProperty('--py',cur.py.toFixed(1)); rootS.style.setProperty('--active',cur.active.toFixed(3)); requestAnimationFrame(loop); })();
    function orient(e){ if(lightbox.hidden||e.gamma==null||e.beta==null)return; const nx=Math.max(-1,Math.min(1,e.gamma/35)), ny=Math.max(-1,Math.min(1,(e.beta-45)/35));
      target.rx=-ny*MAX; target.ry=nx*MAX; target.px=(nx*.5+.5)*100; target.py=(ny*.5+.5)*100; target.active=1; }
    if(matchMedia('(hover: none)').matches){ if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
        const ask=()=>{ DeviceOrientationEvent.requestPermission().then(r=>{ if(r==='granted')addEventListener('deviceorientation',orient); }).catch(()=>{}); document.removeEventListener('click',ask); }; document.addEventListener('click',ask);
      } else addEventListener('deviceorientation',orient); }
  } else rootS.style.setProperty('--active',REST.active);
})();
</script>
